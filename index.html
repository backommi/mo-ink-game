<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨染 - 水墨消除游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            background: #f5e6d3;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 40px;
            pointer-events: none;
            z-index: 10;
        }

        .ui-panel {
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .ui-text {
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
        }

        #score {
            color: #ffd700;
        }

        #ink-level {
            color: #cd853f;
        }

        #game-area {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .ink-drop {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, rgba(20,20,20,1) 0%, rgba(60,60,60,0.6) 50%, rgba(100,100,100,0) 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            pointer-events: auto;
            z-index: 10;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        h1 {
            font-size: 72px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #d4af37, #8b4513);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
            letter-spacing: 8px;
        }

        .instructions {
            text-align: center;
            color: #e0e0e0;
            margin-bottom: 40px;
            line-height: 2;
            font-size: 16px;
        }

        .instructions p {
            margin: 8px 0;
        }

        .key {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            font-family: 'Consolas', monospace;
            margin: 0 6px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .final-score {
            font-size: 42px;
            color: #ffd700;
            margin: 20px 0 40px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            #game-container {
                width: 100%;
                height: 100vh;
            }
            
            h1 { font-size: 48px; letter-spacing: 4px; }
            .ui-text { font-size: 14px; }
            .instructions { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div class="ui-panel">
                <div id="score" class="ui-text">分数：0</div>
            </div>
            <div class="ui-panel">
                <div id="ink-level" class="ui-text">墨迹程度：0%</div>
            </div>
        </div>

        <div id="game-area">
            <!-- 墨滴会在这里生成 -->
        </div>

        <div id="controls">
            <button class="btn" onclick="togglePause()">暂停</button>
            <button class="btn" onclick="resetGame()">重新开始</button>
        </div>

        <div id="start-screen">
            <h1>墨染</h1>
            <div class="instructions">
                <p>🎨 控制墨滴下落，创造独特的水墨画作</p>
                <p style="margin-top: 16px;">
                    <span class="key">←</span><span class="key">→</span> 移动位置
                </p>
                <p>
                    <span class="key">↓</span> 加速下落
                </p>
                <p>
                    <span class="key">空格</span> 收墨消除
                </p>
            </div>
            <button class="btn" style="font-size: 20px; padding: 16px 48px;" onclick="startGame()">开始游戏</button>
        </div>

        <div id="game-over">
            <h1>游戏结束</h1>
            <div class="final-score">最终得分：<span id="final-score-value">0</span></div>
            <button class="btn" style="font-size: 20px; padding: 16px 48px;" onclick="resetGame()">再来一局</button>
        </div>
    </div>

    <script>
        // 游戏状态
        let gameState = {
            score: 0,
            inkLevel: 0,
            isPlaying: false,
            isPaused: false,
            inkDrops: [],
            currentInkX: 400,
            currentInkY: 100,
            inkSpeed: 2,
            lastDropTime: 0,
            dropInterval: 1500
        };

        let gameLoop = null;
        let keyboardListener = null;

        // 开始游戏
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            gameState.isPlaying = true;
            gameState.isPaused = false;
            
            // 创建初始墨滴
            createInkDrop(400, 100);
            
            // 开始游戏循环
            gameLoop = setInterval(update, 16);
            
            // 键盘监听
            keyboardListener = (e) => handleKeyPress(e);
            document.addEventListener('keydown', keyboardListener);
        }

        // 创建墨滴
        function createInkDrop(x, y) {
            const drop = document.createElement('div');
            drop.className = 'ink-drop';
            drop.style.left = x + 'px';
            drop.style.top = y + 'px';
            document.getElementById('game-area').appendChild(drop);
            
            gameState.inkDrops.push({
                element: drop,
                x: x,
                y: y,
                isDropped: false
            });
        }

        // 键盘处理
        function handleKeyPress(e) {
            if (!gameState.isPlaying || gameState.isPaused) return;
            
            const speed = 10;
            const fastSpeed = 20;
            
            switch(e.key) {
                case 'ArrowLeft':
                    gameState.currentInkX = Math.max(50, gameState.currentInkX - speed);
                    break;
                case 'ArrowRight':
                    gameState.currentInkX = Math.min(750, gameState.currentInkX + speed);
                    break;
                case 'ArrowDown':
                    gameState.inkSpeed = fastSpeed;
                    break;
                case ' ':
                    collectInk();
                    e.preventDefault();
                    break;
            }
            
            updateUI();
        }

        // 收墨消除
        function collectInk() {
            const droppedDrops = gameState.inkDrops.filter(d => d.isDropped);
            if (droppedDrops.length === 0) return;
            
            // 计算分数
            const baseScore = droppedDrops.length * 100;
            const riskMultiplier = 1 + (gameState.inkLevel / 100);
            const score = Math.floor(baseScore * riskMultiplier);
            
            gameState.score += score;
            
            // 减少墨迹程度
            gameState.inkLevel = Math.max(0, gameState.inkLevel - (droppedDrops.length * 5));
            
            // 移除墨滴
            droppedDrops.forEach(drop => {
                drop.element.remove();
                gameState.inkDrops = gameState.inkDrops.filter(d => d !== drop);
            });
            
            updateUI();
        }

        // 游戏更新
        function update() {
            if (!gameState.isPlaying || gameState.isPaused) return;
            
            const now = Date.now();
            
            // 自动下落
            gameState.currentInkY += gameState.inkSpeed;
            
            // 触底检测
            if (gameState.currentInkY >= 550) {
                // 固定当前墨滴
                const currentDrop = gameState.inkDrops[gameState.inkDrops.length - 1];
                if (currentDrop) {
                    currentDrop.isDropped = true;
                }
                
                // 增加墨迹程度
                gameState.inkLevel = Math.min(100, gameState.inkLevel + 10);
                
                // 重置墨滴位置
                gameState.currentInkY = 100;
                gameState.currentInkX = 400 + (Math.random() - 0.5) * 200;
                gameState.inkSpeed = 2;
                
                // 创建新墨滴
                createInkDrop(gameState.currentInkX, gameState.currentInkY);
                
                updateUI();
                
                // 游戏结束检测
                if (gameState.inkLevel >= 100) {
                    gameOver();
                }
            }
            
            // 更新最后一个墨滴位置
            const lastDrop = gameState.inkDrops[gameState.inkDrops.length - 1];
            if (lastDrop) {
                lastDrop.x = gameState.currentInkX;
                lastDrop.y = gameState.currentInkY;
                lastDrop.element.style.left = gameState.currentInkX + 'px';
                lastDrop.element.style.top = gameState.currentInkY + 'px';
            }
        }

        // 更新 UI
        function updateUI() {
            document.getElementById('score').innerText = `分数：${gameState.score}`;
            document.getElementById('ink-level').innerText = `墨迹程度：${Math.floor(gameState.inkLevel)}%`;
        }

        // 游戏结束
        function gameOver() {
            gameState.isPlaying = false;
            gameState.isPaused = true;
            
            clearInterval(gameLoop);
            document.removeEventListener('keydown', keyboardListener);
            
            document.getElementById('final-score-value').innerText = gameState.score;
            document.getElementById('game-over').style.display = 'flex';
        }

        // 重置游戏
        function resetGame() {
            // 清除所有墨滴
            gameState.inkDrops.forEach(drop => drop.element.remove());
            gameState.inkDrops = [];
            
            // 重置状态
            gameState.score = 0;
            gameState.inkLevel = 0;
            gameState.currentInkX = 400;
            gameState.currentInkY = 100;
            gameState.inkSpeed = 2;
            
            updateUI();
            
            // 隐藏游戏结束界面
            document.getElementById('game-over').style.display = 'none';
            
            // 重新开始
            startGame();
        }

        // 暂停
        function togglePause() {
            if (!gameState.isPlaying) return;
            gameState.isPaused = !gameState.isPaused;
        }
    </script>
</body>
</html>
