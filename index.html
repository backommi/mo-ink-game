<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨染 - 水墨消除游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 40px;
            pointer-events: none;
            z-index: 10;
        }

        .ui-panel {
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .ui-text {
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
        }

        #score {
            color: #ffd700;
        }

        #ink-level {
            color: #cd853f;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            pointer-events: auto;
            z-index: 10;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        h1 {
            font-size: 72px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #d4af37, #8b4513);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
            letter-spacing: 8px;
        }

        .instructions {
            text-align: center;
            color: #e0e0e0;
            margin-bottom: 40px;
            line-height: 2;
            font-size: 16px;
        }

        .instructions p {
            margin: 8px 0;
        }

        .key {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            font-family: 'Consolas', monospace;
            margin: 0 6px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .final-score {
            font-size: 42px;
            color: #ffd700;
            margin: 20px 0 40px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            #game-container {
                width: 100%;
                height: 100vh;
            }
            
            h1 { font-size: 48px; letter-spacing: 4px; }
            .ui-text { font-size: 14px; }
            .instructions { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div class="ui-panel">
                <div id="score" class="ui-text">分数：0</div>
            </div>
            <div class="ui-panel">
                <div id="ink-level" class="ui-text">墨迹程度：0%</div>
            </div>
        </div>

        <div id="controls">
            <button class="btn" onclick="togglePause()">暂停</button>
            <button class="btn" onclick="resetGame()">重新开始</button>
        </div>

        <div id="start-screen">
            <h1>墨染</h1>
            <div class="instructions">
                <p>🎨 控制墨滴下落，创造独特的水墨画作</p>
                <p style="margin-top: 16px;">
                    <span class="key">←</span><span class="key">→</span> 移动位置
                </p>
                <p>
                    <span class="key">↓</span> 加速下落
                </p>
                <p>
                    <span class="key">空格</span> 收墨消除
                </p>
            </div>
            <button class="btn" style="font-size: 20px; padding: 16px 48px;" onclick="startGame()">开始游戏</button>
        </div>

        <div id="game-over">
            <h1>游戏结束</h1>
            <div class="final-score">最终得分：<span id="final-score-value">0</span></div>
            <button class="btn" style="font-size: 20px; padding: 16px 48px;" onclick="resetGame()">再来一局</button>
        </div>
    </div>

    <script type="module" src="/src/main.js?v=20260320214500"></script>
    <script>
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            if (window.gameInstance) {
                const scene = window.gameInstance.scene.getScene('GameScene');
                if (scene) {
                    scene.resetGame();
                }
            }
        }

        function togglePause() {
            const scene = window.gameInstance.scene.getScene('GameScene');
            if (scene) {
                scene.isPaused = !scene.isPaused;
            }
        }

        function resetGame() {
            document.getElementById('game-over').style.display = 'none';
            const scene = window.gameInstance.scene.getScene('GameScene');
            if (scene) {
                scene.resetGame();
            }
        }
    </script>
</body>
</html>
