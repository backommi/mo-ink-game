<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨染 - 水墨消除游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }

        .ui-text {
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        #score {
            color: #ffd700;
        }

        #ink-level {
            color: #8b4513;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        h1 {
            font-size: 64px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #ffd700, #8b4513);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .instructions {
            text-align: center;
            color: #ccc;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .key {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            font-family: monospace;
            margin: 0 4px;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .final-score {
            font-size: 48px;
            color: #ffd700;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            h1 { font-size: 48px; }
            .ui-text { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div id="score">分数: 0</div>
            <div id="ink-level">墨迹程度: 0%</div>
        </div>

        <div id="controls">
            <button class="btn" onclick="togglePause()">暂停</button>
            <button class="btn" onclick="resetGame()">重新开始</button>
        </div>

        <div id="start-screen">
            <h1>墨染</h1>
            <div class="instructions">
                <p>🎨 控制墨滴下落，创造独特的水墨画作</p>
                <p>
                    <span class="key">←</span> <span class="key">→</span> 移动位置 |
                    <span class="key">↓</span> 加速下落 |
                    <span class="key">空格</span> 收墨消除
                </p>
            </div>
            <button class="btn" style="font-size: 24px; padding: 16px 48px;" onclick="startGame()">开始游戏</button>
        </div>

        <div id="game-over">
            <h1>游戏结束</h1>
            <div class="final-score">最终得分: <span id="final-score-value">0</span></div>
            <button class="btn" style="font-size: 24px; padding: 16px 48px;" onclick="resetGame()">再来一局</button>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
